[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "usecvislib"
version = "0.4.1"
description = "Universal Security Visualization Library for attack trees, threat modeling, and binary analysis"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "VULNEX" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Visualization",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "graphviz>=0.20",
    "toml>=0.10.2",
    "tomli>=2.0; python_version < '3.11'",  # spec-compliant TOML reader on 3.10 (stdlib tomllib is 3.11+)
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "pytm>=1.2.0",
    "networkx>=3.0",
    "cairosvg>=2.7.0",
    "diagrams>=0.24.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.5.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # required by starlette/FastAPI TestClient in tests/test_api_*
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/vulnex/usecvislib"
Repository = "https://github.com/vulnex/usecvislib"

[project.scripts]
usecvis = "usecvislib.usecvis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
usecvislib = ["models/*.tml"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear (common bugs)
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade (Python version modernization)
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (stray prints)
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",   # assert used (needed in tests)
    "S603",   # subprocess call (false positives on safe usage)
    "S607",   # partial executable path (false positives)
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "UP007",  # Use X | Y for union types (keep Optional for 3.10 compat)
    "UP045",  # Use X | None instead of Optional[X] (keep Optional for 3.10 compat, matches UP007)
    "RUF012", # Mutable class defaults: visualization classes use class-level style/config dicts by design
    "E501",   # Line length is owned by the formatter (ruff format), not double-enforced by the linter
    "S110",   # try-except-pass: used deliberately for best-effort temp-file/render cleanup paths
    "S112",   # try-except-continue: deliberate best-effort skip in batch loops
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "T20"]
"src/usecvislib/usecvis.py" = ["T201"]  # CLI entry point: print() is the intended output channel

[tool.pytest.ini_options]
testpaths = ["tests"]
