# Controls
[[nodes]]
id = "waf"
type = "control"
name = "WAF"
status = "Active"
effectiveness = "High"

[[nodes]]
id = "encryption"
type = "control"
name = "Encryption at Rest"
status = "Active"
effectiveness = "High"

[[nodes]]
id = "mfa"
type = "control"
name = "MFA"
status = "Partial"
effectiveness = "High"

[[nodes]]
id = "audit_logs"
type = "control"
name = "Audit Logging"
status = "Active"
effectiveness = "Medium"

[[edges]]
from = "waf"
to = "sql_injection"
type = "mitigates"
effectiveness = "80%"

[[edges]]
from = "waf"
to = "xss"
type = "mitigates"
effectiveness = "70%"

[[edges]]
from = "encryption"
to = "pii_exposure"
type = "mitigates"
effectiveness = "90%"

[[edges]]
from = "mfa"
to = "brute_force"
type = "mitigates"
effectiveness = "95%"

[[edges]]
from = "mfa"
to = "session_hijack"
type = "mitigates"
effectiveness = "60%"

[[edges]]
from = "audit_logs"
to = "api_keys_exposed"
type = "mitigates"
effectiveness = "50%"

[[edges]]
from = "weak_password"
to = "brute_force"
type = "escalates"
condition = "enables"

# Risks grouped by category; the fill color gives the severity
[[clusters]]
id = "injection"
label = "Injection"
nodes = ["sql_injection", "cmd_injection", "xss"]
style = { color = "#7F8C8D", style = "rounded" }

[[clusters]]
id = "authentication"
label = "Authentication"
nodes = ["weak_password", "brute_force", "session_hijack"]
style = { color = "#7F8C8D", style = "rounded" }

[[clusters]]
id = "data_exposure"
label = "Data Exposure"
nodes = ["pii_exposure", "api_keys_exposed"]
style = { color = "#7F8C8D", style = "rounded" }

[[clusters]]
id = "misconfiguration"
label = "Misconfiguration"
nodes = ["debug_enabled", "outdated_deps"]
style = { color = "#7F8C8D", style = "rounded" }

[[clusters]]
id = "controls"
label = "Security Controls"
nodes = ["waf", "encryption", "mfa", "audit_logs"]
style = { color = "#1ABC9C", style = "dashed" }
