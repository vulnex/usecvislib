#
# VULNEX -Universal Security Visualization Library-
#
# Trend chart template: how an engagement's metrics evolve across six daily
# snapshots. One panel per metric on a shared time axis; the severity series
# share a stacked panel. Values are illustrative.
#

[trend]
name = "Engagement metrics"

[panels."Vulnerabilities by severity"]
stacked = true
unit = "findings"

[[series]]
name = "Hosts"
unit = "hosts"
points = [
    {t = "2026-10-01T09:00:00Z", value = 10},
    {t = "2026-10-02T09:00:00Z", value = 15},
    {t = "2026-10-03T09:00:00Z", value = 22},
    {t = "2026-10-04T09:00:00Z", value = 22},
    {t = "2026-10-05T09:00:00Z", value = 24},
    {t = "2026-10-06T09:00:00Z", value = 23},
]

[[series]]
name = "Critical"
panel = "Vulnerabilities by severity"
severity = "critical"
points = [
